services:
  # 1. Base de Datos PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: tcg_examen_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tcg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tcg_examen_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Microservicio de Catálogo
  catalogo-service:
    build:
      context: ./microservicio-catalogo/catalogo-service
      dockerfile: Dockerfile
    container_name: catalogo-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/tcg_examen_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - tcg-network

  # 3. API Gateway (Punto de entrada único)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - catalogo-service
    networks:
      - tcg-network

networks:
  tcg-network:
    driver: bridge

volumes:
  postgres_data: